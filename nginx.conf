server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # verbs.json (4 MB) y el resto de assets/JS comprimen muy bien.
  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml application/wasm;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
